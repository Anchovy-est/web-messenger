# Render Blueprint — deploys the backend (backend/Dockerfile) + a
# managed Postgres database in one go. See README.md's Deployment
# section for the exact click-through steps (connect this repo, fill in
# the `sync: false` secrets in Render's dashboard, note the resulting
# backend URL for the Vercel side).
#
# Uploads (avatar images, message media) are written to a local disk at
# /app/uploads. Render's free instance plan doesn't just fail to persist
# a disk across redeploys — it refuses to deploy a Blueprint that
# declares one at all, so there's no `disk` block here. Practically:
# uploaded avatars/media are lost on every redeploy/restart on the free
# plan. To get real persistence, upgrade the `backend` service below to
# a paid plan and add:
#   disk:
#     name: uploads
#     mountPath: /app/uploads
#     sizeGB: 1
# or swap in object storage (S3-compatible) instead.
databases:
  - name: web-messenger-db
    databaseName: messenger
    user: messenger
    plan: free

services:
  - type: web
    name: web-messenger-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: web-messenger-db
          property: connectionString
      # Generate each of these with, e.g.:
      #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: PROFILE_ENCRYPTION_KEY
        sync: false
      # The deployed Vercel web client's origin(s), comma-separated —
      # e.g. https://your-app.vercel.app. Required: the backend refuses
      # to start in production without this set (see
      # backend/src/config/env.js).
      - key: CORS_ORIGINS
        sync: false
      # This service's own public URL, once Render assigns one (used in
      # verification/reset emails' links, if you add any — currently
      # just informational).
      - key: APP_BASE_URL
        sync: false
      # Outgoing email — leave unset and the backend logs
      # verification/reset codes to its own console instead of sending
      # them (see backend/src/services/email.service.js), same as local
      # dev. Fine for a demo deployment; set these for real email.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: 26214400
